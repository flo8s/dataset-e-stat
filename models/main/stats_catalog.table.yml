schema: main
name: stats_catalog
title: 統計表カタログ
description: '統計表カタログ。getStatsList の統計表メタデータと getMetaInfo の分類軸名を

  統計表単位で結合し、政府統計名・統計分野・集計地域区分・分類軸名で横断検索できる。

  分類項目の詳細は raw_meta_info を参照。'
keywords:
  - e-stat
  - 統計表
  - カタログ
published: true
sources:
  - path: https://www.e-stat.go.jp/stat-search/database
fields:
  - name: stats_data_id
    title: 統計表ID
  - name: stat_code
    title: 政府統計コード
  - name: stat_name
    title: 政府統計名
  - name: gov_org_name
    title: 作成機関名
  - name: statistics_name
    title: 提供統計名
  - name: table_title
    title: 統計表題名
  - name: main_category_code
    title: 統計大分野コード
  - name: main_category
    title: 統計大分野
  - name: sub_category_code
    title: 統計小分野コード
  - name: sub_category
    title: 統計小分野
  - name: collect_area
    title: 集計地域区分
  - name: cycle
    title: 提供周期
  - name: survey_date
    title: 調査年月
  - name: updated_date
    title: 更新日
  - name: class_names
    title: 分類軸名リスト (area/time除外)
