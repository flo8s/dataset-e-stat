schema: main
name: stg_stats_list
title: 統計表一覧
description: 'e-Stat API getStatsList から取得した統計表情報。

  e-Stat で提供している統計表の情報（政府統計名、作成機関、統計表題名、調査年月、公開日、統計分野等）を提供する。

  API仕様: https://www.e-stat.go.jp/api/api-info/e-stat-manual3-0#api_2_1'
keywords:
  - e-stat
  - メタデータ
published: false
sources:
  - path: https://www.e-stat.go.jp/stat-search/database
