version: 2

models:
  - name: stg_stats_list
    description: |
      e-Stat API getStatsList から取得した統計表情報。
      e-Stat で提供している統計表の情報（政府統計名、作成機関、統計表題名、調査年月、公開日、統計分野等）を提供する。
      API仕様: https://www.e-stat.go.jp/api/api-info/e-stat-manual3-0#api_2_1
    columns:
      - name: id
        description: "統計表ID（e-Stat の statsDataId）。e-Stat API で統計表を指定するときのキーで、1つの統計表に1件"
      - name: stat_code
        description: "政府統計コード（8桁）。統計調査そのものの識別子で、1つの調査に多数の統計表がぶら下がる（例: 00200502 = 社会・人口統計体系）"
      - name: stat_name
        description: "政府統計名。stat_code に対応する統計調査の名称"
      - name: gov_org_code
        description: "作成機関コード。統計表を作成した府省庁の識別子"
      - name: gov_org_name
        description: "作成機関名（総務省統計局 など）"
      - name: statistics_name
        description: "提供統計名称。同じ政府統計の中での提供単位（年次・調査回など）を表す名前"
      - name: tabulation_category
        description: "提供統計名称の集計分類。e-Stat の statisticsNameSpec.tabulationCategory"
      - name: tabulation_sub_category
        description: "集計サブ分類。e-Stat の tabulationSubCategory1〜5 を「 > 」で連結したもので、空の階層は詰めてある"
      - name: title
        description: "統計表題名。e-Stat の title / title.$ / tableName のうち最初に値のあるものを採っている"
      - name: table_number
        description: "表番号。統計表に付された通し番号で、統計表IDとは別物"
      - name: table_category
        description: "表分類。e-Stat の titleSpec.tableCategory"
      - name: table_name
        description: "表名。e-Stat の titleSpec.tableName"
      - name: table_explanation
        description: "表の説明。統計表に付された注記で、空のことが多い"
      - name: table_sub_category
        description: "表サブ分類。e-Stat の tableSubCategory1〜3 を「 > 」で連結したもので、空の階層は詰めてある"
      - name: main_category_code
        description: "統計大分野コード（2桁）。e-Stat の分野分類の上位（02=人口・世帯、03=労働・賃金 など）"
      - name: main_category
        description: "統計大分野名"
      - name: sub_category_code
        description: "統計小分野コード。大分野の下位区分"
      - name: sub_category
        description: "統計小分野名"
      - name: cycle
        description: "提供周期（年次、年度次、四半期、半期、月次、- のいずれか）"
      - name: survey_date
        description: "調査年月。YYYYMM または YYYYMM-YYYYMM 形式の文字列で、日付型ではない"
      - name: open_date
        description: "e-Stat に公開された日（YYYY-MM-DD 形式の文字列）"
      - name: updated_date
        description: "統計表が最後に更新された日"
      - name: small_area
        description: "小地域集計の有無フラグ（e-Stat の smallArea）。本データセットが取得している範囲では全て 0 で、判別には使えない"
      - name: collect_area
        description: "集計地域区分（全国／都道府県／市区町村／該当なし）。統計表がどの地域粒度まで持つかを表す"
      - name: overall_total_number
        description: "当該統計表の総データ件数。e-Stat API から1回で取り切れるかの目安になる"

  - name: raw_meta_info
    description: |
      e-Stat API getMetaInfo から取得したメタ情報。
      各統計表の表章事項・分類事項・地域事項・時間軸事項のコード、名称、単位、階層レベル等を提供する。
      API仕様: https://www.e-stat.go.jp/api/api-info/e-stat-manual3-0#api_2_5
    columns:
      - name: stats_data_id
        description: "統計表ID（e-Stat の statsDataId）。stg_stats_list の id、stats_catalog の stats_data_id と同じキー"
      - name: class_id
        description: "分類軸ID。tab=表章事項、cat01〜cat15=分類事項、area=地域事項、time=時間軸事項。各 mart テーブルの tab / cat01 / area / time 列がどの軸かはここで対応する"
      - name: class_name
        description: "分類軸の名称（表章項目、地域、時間軸 など）。統計表ごとに付け方が違う"
      - name: class_description
        description: "分類軸につけられた解説文。設定されていない統計表が多く、その場合は空"
      - name: item_code
        description: "分類項目のコード。各 mart テーブルの tab / cat01 / area / time の値と突き合わせる結合キー"
      - name: item_name
        description: "分類項目名。item_code に対応する表示名"
      - name: level
        description: "階層レベル。1 が最上位で、数字が大きいほど下位。統計表によっては全て 1 で階層を持たない"
      - name: unit
        description: "当該項目の単位。単位を持つのは主に表章事項・分類事項で、地域や時間軸では空"
      - name: parent_code
        description: "上位項目のコード。階層を持たない統計表では空"
      - name: add_inf
        description: "e-Stat の追加情報欄。設定されていないことが多く、その場合は空"

  - name: stats_catalog
    description: |
      統計表カタログ。getStatsList の統計表メタデータと getMetaInfo の分類軸名を
      統計表単位で結合し、政府統計名・統計分野・集計地域区分・分類軸名で横断検索できる。
      分類項目の詳細は raw_meta_info を参照。
    access: public
    columns:
      - name: stats_data_id
        description: "統計表ID（e-Stat の statsDataId）。この表の一意キーで、e-Stat API で統計表を指定するときにも使う"
      - name: stat_code
        description: "政府統計コード（8桁）。統計調査そのものの識別子で、1つの調査に多数の統計表がぶら下がる（例: 00200502 = 社会・人口統計体系）"
      - name: stat_name
        description: "政府統計名。stat_code に対応する統計調査の名称"
      - name: gov_org_name
        description: "作成機関名（総務省統計局 など）"
      - name: statistics_name
        description: "提供統計名称。同じ政府統計の中での提供単位（年次・調査回など）を表す名前"
      - name: table_title
        description: "統計表題名。どんな表かを人が読んで判断するための主要な手がかり"
      - name: main_category_code
        description: "統計大分野コード（2桁）。e-Stat の分野分類の上位（02=人口・世帯、03=労働・賃金 など）"
      - name: main_category
        description: "統計大分野名"
      - name: sub_category_code
        description: "統計小分野コード。大分野の下位区分"
      - name: sub_category
        description: "統計小分野名"
      - name: collect_area
        description: "集計地域区分（全国／都道府県／市区町村／該当なし）。欲しい地域粒度の統計表を絞り込むのに使う"
      - name: cycle
        description: "提供周期（年次、年度次、四半期、半期、月次、- のいずれか）"
      - name: survey_date
        description: "調査年月。YYYYMM または YYYYMM-YYYYMM 形式の文字列で、日付型ではない"
      - name: updated_date
        description: "統計表が最後に更新された日（YYYY-MM-DD 形式の文字列）"
      - name: class_names
        description: "当該統計表が持つ分類軸名の配列（VARCHAR[]）。地域 area と時間軸 time は除いてあるので、表章事項と分類事項だけが並ぶ。どんな切り口で集計できる表かをこの列で探せる"
