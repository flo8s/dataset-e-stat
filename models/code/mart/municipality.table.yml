schema: code
name: municipality
title: 統計に用いる標準地域コード
description: '統計に用いる標準地域コードの現行一覧。都道府県・郡・市区町村を 5 桁の

  標準地域コード (area_code) で収録する。国勢調査小地域・境界データ・社会人口

  統計体系 (SSDS) など本データセットの各テーブルが用いる地域コードと同体系で、

  コードから名称・よみがなを引くマスタとして使える。

  全国地方公共団体コード (6 桁・チェックデジット付き) とは別体系。

  出典: 総務省統計局 統計に用いる標準地域コード。

  https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm'
keywords:
  - e-stat
  - 標準地域コード
  - 市区町村コード
  - 都道府県
published: true
sources:
  - path: https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
fields:
  - name: area_code
    title: 標準地域コード（5桁）
  - name: pref_code
    title: 都道府県コード（2桁）
  - name: pref_name
    title: 都道府県名
  - name: district_name
    title: 郡・振興局・政令市名（区の場合は所属市。無い場合は空）
  - name: municipality_name
    title: 市区町村名
  - name: yomigana
    title: よみがな
  - name: is_prefecture
    title: 都道府県の合計行か（コード末尾3桁が000）
