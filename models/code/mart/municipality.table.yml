schema: code
name: municipality
title: 統計に用いる標準地域コード
description: |-
  統計に用いる標準地域コードの現行一覧。都道府県・郡・市区町村を 5 桁の
  標準地域コード (area_code) で収録する。国勢調査小地域・境界データ・社会人口
  統計体系 (SSDS) など本データセットの各テーブルが用いる地域コードと同体系で、
  コードから名称・よみがなを引くマスタとして使える。
  全国地方公共団体コード (6 桁・チェックデジット付き) とは別体系。

  都道府県・政令指定都市・行政区・郡/振興局/支庁・市区町村が同一テーブルに
  同居しているため、どの階層の行かは area_kind で判別する。市区町村として
  数える行は is_municipality が真の行 (政令指定都市を 1 団体として数え、
  行政区は数えない)。東京の特別区 23 は市区町村として数え、その親にあたる
  集計行「特別区部」(13100) は数えない。同じ「区」でも行政区と特別区で
  扱いが逆になる点に注意。

  出典: 総務省統計局 統計に用いる標準地域コード。
  https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
keywords:
  - e-stat
  - 標準地域コード
  - 市区町村コード
  - 都道府県
published: true
sources:
  - path: https://www.soumu.go.jp/toukei_toukatsu/index/seido/9-5.htm
fields:
  - name: area_code
    title: 標準地域コード（5桁）
  - name: pref_code
    title: 都道府県コード（2桁）
  - name: pref_name
    title: 都道府県名
  - name: district_name
    title: 郡・振興局・政令市名（区の場合は所属市。無い場合は NULL）
  - name: municipality_name
    title: 市区町村名（都道府県・郡・政令市の集計行では NULL）
  - name: yomigana
    title: よみがな
  - name: is_prefecture
    title: 都道府県の合計行か（コード末尾3桁が000）
  - name: area_kind
    title: 階層区分（prefecture / designated_city / ward / district / municipality）
  - name: is_municipality
    title: 市区町村として数える行か（政令市は1団体、行政区は数えない）
  - name: county_name
    title: 郡名（郡に属さない場合は NULL。北海道は振興局・支庁で括られるため NULL）
  - name: subprefecture_name
    title: 振興局・支庁名（北海道のみ。それ以外は NULL）
  - name: designated_city_name
    title: 政令指定都市名（政令市の集計行と行政区のみ。それ以外は NULL）
  - name: municipality_code
    title: 所属する市区町村の標準地域コード（行政区は所属市、市区町村は自分自身、集計行は NULL）
