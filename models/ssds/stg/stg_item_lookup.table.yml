schema: ssds
name: stg_item_lookup
description: 'mart のビューが item_name / unit を引くための、item_code で一意な参照表。

  item_catalog は掲載統計表ごとに行を持つため、直接 JOIN すると観測値が複製される。'
published: false
fields:
  - name: item_code
    title: 指標コード
    description: 分類項目のコード。item_catalog の item_code を一意化したもので、各 mart テーブルの cat01 と突き合わせる結合キー
  - name: item_name
    title: 指標名
    description: 分類項目名。同じ item_code で表記が食い違う場合（5,377 件中 8 件、全角/半角括弧などの揺れ）は stats_data_id の小さい統計表の表記を採る
  - name: unit
    title: 単位
    description: 当該項目の単位。同じ item_code で unit が食い違う例は無い
  - name: level
    description: item_code の階層の深さ。1 が最上位。コードの前方一致から導いた値で、item_catalog の level 列（常に 1）とは別物
  - name: parent_code
    description: 1つ上の項目のコード。最上位は NULL。自分より短く、かつ自分の先頭に一致するコードのうち最長のものを親としている
