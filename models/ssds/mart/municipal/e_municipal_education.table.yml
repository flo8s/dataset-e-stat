schema: ssds
name: e_municipal_education
title: E 教育（市区町村）
description: '社会・人口統計体系 E 教育（市区町村）。

  学校数、児童生徒数等の指標を収録。廃置分合処理済データ。

  https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000020205

  項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/E'
keywords:
  - e-stat
  - 社会・人口統計体系
  - 市区町村
published: true
sources:
  - path: https://www.e-stat.go.jp/statistics/00200502
fields:
  - name: cat01
    title: 分類事項コード
    description: 統計指標のコード。英字1文字（統計表のカテゴリ A〜K）＋数字4〜6桁で、桁の長いコードほど上位項目の内訳を表す（J1102 生活保護被保護実世帯数 と J110203 うち高齢者世帯 が同じ列に並ぶ）。上位項目と内訳が混在するため、cat01 を絞らずに value を合計すると二重計上になる。指標の定義は ssds.item_catalog を item_code で引く
  - name: item_name
    title: 分類事項名
    description: cat01 に対応する指標名。「J110203_現に保護を受けた生活保護被保護実世帯数（高齢者世帯）」のようにコードが前置される。統計表によって表記ゆれがあるため、絞り込みは item_name ではなく cat01 で行う
  - name: cat01_level
    description: cat01 の階層の深さ。1 が最上位、2 以下はその内訳（J1102 が 1、J110203 が 2）。item_catalog の level 列は常に 1 で使えないため、コードの前方一致から導いている。内訳が親を分割しているとは限らないので、レベルを揃えれば安全に合計できるという意味ではない
  - name: cat01_parent
    description: 1つ上の分類事項のコード。最上位は NULL。cat01_parent IS NULL で最上位だけ、cat01_parent = 'J1102' でその内訳だけを取れる。親子はコードの前方一致で判定しているため、C3120 の下に C31201（海面漁業・養殖業産出額）と C312001（海面漁業産出額）が兄弟として並ぶような、内容の重なる組もある
  - name: area
    title: 地域コード
    description: 市区町村の標準地域コード（5桁）。全国計・都道府県計の行は無いが、政令指定都市の合計行（01100 札幌市）と行政区（01101 中央区）、東京都の「特別区部」（13100）と特別区（13101 千代田区）が同居する。市区町村単位で数えるときは code.municipality の is_municipality で絞る
  - name: area_name
    title: 地域名
    description: 地域名。「北海道 札幌市 豊平区」のように都道府県名から連結された表記
  - name: time_name
    title: 時間軸名
    description: 時間軸の名称。「2020年度」のような西暦の年度／年表記で、和暦は含まない。最も古い行は1980年度だが、収録の開始年も終了年も表・指標によって違う
  - name: year
    title: 年
    description: time_name から抽出した西暦4桁。年度表記の場合は年度の開始年（2020年度 → 2020）
  - name: unit
    title: 単位
    description: 統計値の単位（人、世帯、千円、％ など）。指標ごとに違うため、cat01 を絞らずに value を合計・比較しても意味を持たない。単位を持たない指標は「－」または空
  - name: value
    title: 統計値
    description: 統計値。単位は unit 列を参照。元データが「-」「X」などの非数値だった場合は NULL
