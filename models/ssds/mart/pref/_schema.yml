version: 2

_columns: &columns
  - name: cat01
    description: "統計指標の項目符号。分野1文字（A〜K）+ 大分類1桁 + 小分類1桁 + 項目2桁 の5桁で、その下に副区分が付いたものが7桁以上（A1101 総人口 / A110101 総人口（男））。副区分は1階層だけで、5桁を超えるコードの親は先頭5桁。項目と副区分が同じ列に混在するため、cat01 を絞らずに value を合計すると二重計上になる。符号の定義は https://www.stat.go.jp/data/ssds/2.html"
  - name: item_name
    description: "cat01 に対応する指標名。「J110203_現に保護を受けた生活保護被保護実世帯数（高齢者世帯）」のようにコードが前置される。統計表によって表記ゆれがあるため、絞り込みは item_name ではなく cat01 で行う"
  - name: cat01_parent
    description: "上位項目の符号。5桁の項目は NULL。cat01_parent IS NULL で項目だけ、cat01_parent = 'J1104' でその副区分だけを取れる。副区分が親を分割している保証は無く、A1101 のように男女で分割される系統もあれば、J1102 のように「うち」項目だけが並んで親に届かない系統もある。親自身がデータを持たないこともある（分類項目名だけが定義され、副区分のみ公開されている系統が621件）"
  - name: area
    description: "都道府県の標準地域コード（5桁、末尾3桁は 000）。全国計 00000 の行を含むため、area を絞らずに合計すると二重計上になる。code.municipality の area_code と同体系"
  - name: area_name
    description: "地域名。都道府県名、または全国計の「全国」"
  - name: time_name
    description: "時間軸の名称。「2020年度」のような西暦の年度／年表記で、和暦は含まない。最も古い行は1975年度だが、収録の開始年も終了年も表・指標によって違う"
  - name: year
    description: "time_name から抽出した西暦4桁。年度表記の場合は年度の開始年（2020年度 → 2020）"
  - name: unit
    description: "統計値の単位（人、世帯、千円、％ など）。指標ごとに違うため、cat01 を絞らずに value を合計・比較しても意味を持たない。単位を持たない指標は「－」または空"
  - name: value
    description: "統計値。単位は unit 列を参照。元データが「-」「X」などの非数値だった場合は NULL"

models:
  - name: a_pref_population
    description: |
      社会・人口統計体系 A 人口・世帯（都道府県）。
      総人口、年齢別人口、世帯数、婚姻、出生・死亡、転入・転出等の指標を収録。
      主な出典: 国勢調査、人口推計、人口動態統計、住民基本台帳。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010101
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/A
    access: public
    columns: *columns

  - name: b_pref_land
    description: |
      社会・人口統計体系 B 自然環境（都道府県）。
      気象（気温、降水量、日照時間等）、土地面積、自然災害等の指標を収録。
      主な出典: 気象庁、国土地理院。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010102
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/B
    access: public
    columns: *columns

  - name: c_pref_economy
    description: |
      社会・人口統計体系 C 経済基盤（都道府県）。
      県民所得、事業所数、農業・製造業・商業の生産額等の指標を収録。
      主な出典: 県民経済計算、経済センサス、農林業センサス。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010103
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/C
    access: public
    columns: *columns

  - name: d_pref_administration
    description: |
      社会・人口統計体系 D 行政基盤（都道府県）。
      地方税収、地方交付税、歳出（目的別・性質別）等の指標を収録。
      主な出典: 地方財政状況調査。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010104
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/D
    access: public
    columns: *columns

  - name: e_pref_education
    description: |
      社会・人口統計体系 E 教育（都道府県）。
      学校数、児童生徒数、不登校、いじめ認知件数、学歴別人口等の指標を収録。
      主な出典: 学校基本調査、児童生徒の問題行動等調査、国勢調査。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010105
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/E
    access: public
    columns: *columns

  - name: f_pref_labor
    description: |
      社会・人口統計体系 F 労働（都道府県）。
      就業者数（男女別）、失業率、最低賃金、初任給、他県就業者数等の指標を収録。
      主な出典: 国勢調査、労働力調査、賃金構造基本統計調査。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010106
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/F
    access: public
    columns: *columns

  - name: g_pref_culture
    description: |
      社会・人口統計体系 G 文化・スポーツ（都道府県）。
      投票率、宿泊者数（国内・外国人）、客室稼働率等の指標を収録。
      主な出典: 衆議院議員選挙、宿泊旅行統計調査。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010107
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/G
    access: public
    columns: *columns

  - name: h_pref_housing
    description: |
      社会・人口統計体系 H 居住（都道府県）。
      住宅数、空き家数、着工新設住宅、通勤先別就業者数等の指標を収録。
      主な出典: 住宅・土地統計調査、建築着工統計、国勢調査。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010108
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/H
    access: public
    columns: *columns

  - name: i_pref_health
    description: |
      社会・人口統計体系 I 健康・医療（都道府県）。
      平均寿命、健康寿命、医師数、病院数、死因別死亡者数等の指標を収録。
      主な出典: 生命表、医師・歯科医師・薬剤師統計、人口動態統計。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010109
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/I
    access: public
    columns: *columns

  - name: j_pref_welfare
    description: |
      社会・人口統計体系 J 福祉・社会保障（都道府県）。
      生活保護、保育所数・定員・待機児童数、国民医療費、精神障害者手帳交付数等の指標を収録。
      主な出典: 被保護者調査、社会福祉施設等調査、国民医療費。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010110
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/J
    access: public
    columns: *columns

  - name: k_pref_safety
    description: |
      社会・人口統計体系 K 安全（都道府県）。
      交通事故（発生件数・死者数）、刑法犯認知件数、救急出動件数等の指標を収録。
      主な出典: 交通統計、犯罪統計、救急救助の現況。
      https://www.e-stat.go.jp/stat-search/database?statdisp_id=0000010111
      項目定義: https://www.e-stat.go.jp/koumoku/koumoku_teigi/K
    access: public
    columns: *columns
