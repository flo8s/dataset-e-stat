version: 2

models:
  - name: series_coverage
    description: |
      社会・人口統計体系（SSDS）22表の指標（cat01）ごとの収録年。
      同じ表の中でも指標によって収録年が違うため、表全体の MAX(year) では
      「どこまで新しいか」が分からない。それを指標単位で持つ。
      収録年は地域をまたいだ和で、max_year は「どこかの地域で」その年まで
      入っていることを表す。
    access: public
    columns:
      - name: table_name
        description: "ssds スキーマの表名（a_pref_population など）。この表と同じスキーマにある22表のいずれか"
      - name: cat01
        description: "統計指標の項目符号。各 mart テーブルの cat01 と同じ値。符号の定義は https://www.stat.go.jp/data/ssds/2.html"
      - name: item_name
        description: "cat01 に対応する指標名。参照元テーブルの item_name と同じ値"
      - name: min_year
        description: "いずれかの地域に値が入っている最も古い年。地域をまたいだ和なので、地域を1つに絞ると始まりがこれより後になることがある。value が NULL の行（元データが「-」「X」）は数えない"
      - name: max_year
        description: "いずれかの地域に値が入っている最も新しい年。地域をまたいだ和なので、地域を1つに絞るとこの年の行が無いことがある（c_municipal_economy では199指標中114指標で最新年が地域ごとに違う）。value が NULL の行（元データが「-」「X」）は数えない"
      - name: year_count
        description: "いずれかの地域に値が入っている年の数。max_year - min_year + 1 と一致しない場合は年が飛んでいる（5年ごとの国勢調査ベースの系列など）"

  - name: item_catalog
    description: |
      社会・人口統計体系（SSDS）の基礎データ項目一覧。
      都道府県・市区町村の全22表で利用可能な統計指標とその分類体系を提供する。
      分類体系の詳細: https://www.stat.go.jp/data/ssds/2.html
    access: public
    columns:
      - name: table_title
        description: "当該項目が掲載されている統計表の題名。同じ item_code が複数の統計表に載るため、この列の分だけ行が重複する（5,377 項目に対し 7,093 行）。項目を一意に引くときは stg_item_lookup を使う"
      - name: stats_data_id
        description: "統計表ID（e-Stat の statsDataId）。main.stats_catalog の stats_data_id と同じキー"
      - name: class_id
        description: "分類軸ID。表章事項 tab・地域 area・時間軸 time を除外しているため、SSDS では常に cat01"
      - name: class_name
        description: "分類軸の名称。SSDS では「Ｊ　福祉・社会保障」のような統計表のカテゴリ名が入る"
      - name: class_description
        description: "分類軸につけられた解説文。SSDS では設定されておらず常に空"
      - name: item_code
        description: "分類項目のコード。各 mart テーブルの cat01 と突き合わせる結合キー。桁の長いコードほど上位項目の内訳を表し、階層はコードの前方一致で辿る"
      - name: item_name
        description: "分類項目名。「J110203_現に保護を受けた生活保護被保護実世帯数（高齢者世帯）」のようにコードが前置される"
      - name: level
        description: "階層レベル。SSDS では常に 1 で、階層の判別には使えない。上位・下位は item_code の桁数で見る"
      - name: unit
        description: "当該項目の単位（人、世帯、千円、％ など）。mart テーブルの unit はこの値を引いている"
      - name: parent_code
        description: "上位項目のコード。SSDS では設定されておらず常に空。階層は item_code の前方一致で辿る"
      - name: add_inf
        description: "e-Stat の追加情報欄。SSDS では常に空"
