schema: census
name: daytime_population_mesh_1km
title: 1kmメッシュ別 昼間人口・夜間人口（推計）
description: '1kmメッシュ別の昼間人口・夜間人口・昼夜間人口比率（推計値）。

  昼間人口は1kmメッシュ単位では公表されていないため、令和2年国勢調査と

  令和3年経済センサス‐活動調査の地域メッシュ統計から推計している。

  推計式は「残留人口 = 夜間人口 − 当地に常住する就業者・通学者(15歳以上、自宅従業を含む)」、

  「流入人口 = 経済センサス第2次産業従業者数 + 第3次産業従業者数 + 第1次産業就業者数(常住地)」、

  「昼間人口 = 残留人口 + 流入人口」。

  さらに都道府県ごとに、合計が公表昼間人口(社会・人口統計体系 A6107、令和2年)と

  一致するようスケーリングしている。補正前の値は daytime_population_uncalibrated に残してある。

  推計の限界: 高校・短大・大学への通学による流入は、学校所在地別の在学者数が

  公的オープンデータに存在しないため再現できない。買い物客・観光客は含まない

  (公表昼間人口も同じ)。

  mesh_code は同データセットの境界データ mesh_1km と同一体系で、

  mesh_code で結合して地図化・空間集計できる。

  出典: 総務省統計局 令和2年国勢調査／令和3年経済センサス‐活動調査に関する

  地域メッシュ統計（統計GIS）。

  https://www.e-stat.go.jp/gis'
keywords:
  - e-stat
  - 国勢調査
  - 経済センサス
  - メッシュ
  - 昼間人口
  - 夜間人口
  - GIS
published: true
sources:
