fields:
  - name: area
    title: 地域コード（境界データ small_area の key_code と同一体系）
  - name: area_name
    title: 町丁・字等名称
  - name: cat01
    title: 産業大分類コード
  - name: industry
    title: 産業大分類名
  - name: cat02
    title: 秘匿・合算区分コード
  - name: secrecy
    title: 秘匿・合算区分名（無し/合算/秘匿）
  - name: unit
    title: 単位
  - name: value
    title: 就業者数
