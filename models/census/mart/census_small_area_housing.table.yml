schema: census
name: census_small_area_housing
title: 小地域別 住宅の所有関係別一般世帯数（令和2年国勢調査）
description: '令和2年国勢調査 小地域(町丁・字等)別 住宅の所有の関係別一般世帯数。

  area は同データセットの境界データ small_area の key_code と同一体系で、

  key_code = area で境界ポリゴン・人口・世帯数と結合できる。

  area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。

  分類は cat01=住宅の種類・所有の関係(住宅に住む一般世帯・持ち家・民営借家 など)、

  cat02=秘匿・合算区分(無し/合算/秘匿)。

  出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。

  https://www.e-stat.go.jp/gis'
keywords:
  - e-stat
  - 国勢調査
  - 小地域
  - 町丁字
  - 住宅
  - 所有関係
published: true
sources:
  - path: https://www.e-stat.go.jp/gis
fields:
  - name: area
    title: 地域コード（境界データ small_area の key_code と同一体系）
  - name: area_name
    title: 町丁・字等名称
  - name: cat01
    title: 住宅の種類・所有の関係コード
  - name: tenure
    title: 住宅の種類・所有の関係名
  - name: cat02
    title: 秘匿・合算区分コード
  - name: secrecy
    title: 秘匿・合算区分名（無し/合算/秘匿）
  - name: unit
    title: 単位
  - name: value
    title: 一般世帯数
