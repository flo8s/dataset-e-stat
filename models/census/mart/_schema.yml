    columns:
      - name: area
        meta:
          title: 地域コード（境界データ small_area の key_code と同一体系）
      - name: area_name
        meta:
          title: 町丁・字等名称
      - name: cat01
        meta:
          title: 住宅の種類・所有の関係コード
      - name: tenure
        meta:
          title: 住宅の種類・所有の関係名
      - name: cat02
        meta:
          title: 秘匿・合算区分コード
      - name: secrecy
