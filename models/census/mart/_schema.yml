version: 2

models:
  - name: census_small_area_age
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 年齢(5歳階級・4区分)別、男女別人口。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=年齢区分、cat02=男女区分。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    config:
      meta:
        title: "小地域別 年齢・男女別人口（令和2年国勢調査）"
        published: true
        source_url: "https://www.e-stat.go.jp/gis"
        tags: ["e-stat", "国勢調査", "小地域", "町丁字", "人口", "年齢"]
    columns:
      - name: area
        meta:
          title: 地域コード（境界データ small_area の key_code と同一体系）
      - name: area_name
        meta:
          title: 町丁・字等名称
      - name: cat01
        meta:
          title: 年齢区分コード
      - name: age_class
        meta:
          title: 年齢区分名（5歳階級・4区分）
      - name: cat02
        meta:
          title: 男女区分コード
      - name: sex
        meta:
          title: 男女区分名
      - name: unit
        meta:
          title: 単位
      - name: value
        meta:
          title: 人口

  - name: census_small_area_household
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 世帯の家族類型別一般世帯数。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=世帯の家族類型(一般世帯総数・親族世帯・核家族世帯・夫婦のみ・
      夫婦と子供 など)、cat02=秘匿・合算区分(無し/合算/秘匿)。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
    config:
      meta:
        title: "小地域別 世帯の家族類型別一般世帯数（令和2年国勢調査）"
        published: true
        source_url: "https://www.e-stat.go.jp/gis"
        tags: ["e-stat", "国勢調査", "小地域", "町丁字", "世帯", "家族類型"]
    columns:
      - name: area
        meta:
          title: 地域コード（境界データ small_area の key_code と同一体系）
      - name: area_name
        meta:
          title: 町丁・字等名称
      - name: cat01
        meta:
          title: 家族類型コード
      - name: family_type
        meta:
          title: 世帯の家族類型名
      - name: cat02
        meta:
          title: 秘匿・合算区分コード
      - name: secrecy
        meta:
          title: 秘匿・合算区分名（無し/合算/秘匿）
      - name: unit
        meta:
          title: 単位
      - name: value
        meta:
          title: 一般世帯数

  - name: census_small_area_industry
    description: |
      令和2年国勢調査 小地域(町丁・字等)別 産業(大分類)別就業者数。
      area は同データセットの境界データ small_area の key_code と同一体系で、
      key_code = area で境界ポリゴン・人口・世帯数と結合できる。
      area には市区町村(5桁)と小地域(9桁/11桁)の各階層が含まれる。
      分類は cat01=産業大分類(総数・農業林業・製造業・卸売小売業 など)、
      cat02=秘匿・合算区分(無し/合算/秘匿)。値は就業者数(人)。
      出典: 総務省統計局 令和2年国勢調査 小地域集計（統計GIS）。
      https://www.e-stat.go.jp/gis
    access: public
