name: Diagnose DuckLake

# DuckLake カタログ破損 (multiple snapshots) 調査用。手動実行のみ。
# scripts/diagnose_ducklake.py を Neon シークレット付きで CI 上で走らせる。
# 読み取り専用 (TYPE POSTGRES READ_ONLY) でメタデータを変更しない。
on:
  workflow_dispatch:
    inputs:
      meta_schema:
        description: "DuckLake metadata schema in Neon (本番: e_stat / dev: dev_e_stat)"
        default: "e_stat"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run diagnostic (read-only)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: uv run --no-project --with duckdb python scripts/diagnose_ducklake.py "${{ inputs.meta_schema }}"
